services:
  # ─── BACKEND / API (Node.js + Express) ──────────────────────────────────────
  - type: web
    name: integra-api
    runtime: node
    rootDir: api
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ORACLE_USER
        sync: false
      - key: ORACLE_PASSWORD
        sync: false
      - key: ORACLE_CONNECT_STRING
        sync: false
      - key: CORS_ORIGIN
        value: "*"

  # ─── FRONTEND (React Web / Vite) ───────────────────────────────────────────
  - type: web
    name: integra-web
    runtime: static
    buildCommand: npm install; npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: integra-api
          type: web
          property: host
